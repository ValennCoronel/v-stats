services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: vstats
      POSTGRES_PASSWORD: vstats_password
      POSTGRES_DB: vstats_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U vstats -d vstats_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://vstats:vstats_password@db:5432/vstats_db
      - JWT_SECRET=local_development_secret_key_123
    volumes:
      - ./api:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma migrate dev --name update && npm run seed:local && npm run dev"

volumes:
  db_data:
